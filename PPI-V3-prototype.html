<style>

  --navy:#0E1655; --good:#1b7f3b; --bad:#c0262d;

*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
h2{font-size:15px;margin:0 0 10px;color:var(--navy)}

.card{background:var(--surface-1);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;font-size:13px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--text-secondary);font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.na{color:var(--text-muted);font-style:italic}
.pos,.ph .lab b.pos{color:var(--bad)} .neg,.ph .lab b.neg{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;color:var(--text-secondary);font-size:13px}
.lens{display:grid;grid-template-columns:1fr;gap:18px}
.row3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.ph .lab{min-height:32px;align-items:flex-start;gap:6px}
.len h3{font-size:13px;margin:0 0 6px;color:var(--text-primary)}
.ph{margin:0 0 6px}
.ph .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary)}
.ph .lab b{color:var(--text-primary);font-weight:600}
svg text{font:11px system-ui,sans-serif;fill:var(--text-secondary)}
.note{font-size:12px;color:var(--text-muted);margin-top:8px}
</style>

function methode(t,q,e,qh){const li=a=>'<ul>'+a.map(x=>typeof x==='string'?'<li>'+x+'</li>':'<li>'+x.t+li(x.l)+'</li>').join('')+'</ul>';
 return `<div class="methode"><div class="mt">Méthode : ${t}</div><div class="mg"><div><div class="ms">1. Les questions à se poser${qh?', '+qh:''}</div>${li(q)}</div><div><div class="ms">2. Ce qui doit émerger de cette partie de l’entretien</div>${li(e)}</div></div></div>`;}

function cadrage(t,x){return `<div class="methode"><div class="mt">Cadrage : ${t}</div><p style="margin:0;font-size:14px;color:#0E1655;line-height:1.45">${x}</p></div>`;}

// Masque de saisie des temps MM:SS.CC (repris de la V2) : formaté avant l'enregistrement dans l'état
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('time-input'))return;
 const v=t.value.replace(/[^0-9]/g,'').slice(0,6);let f='';if(v.length>=1)f=v.substring(0,2);if(v.length>=2)f+=':';if(v.length>=3)f+=v.substring(2,4);if(v.length>=4)f+='.';if(v.length>=5)f+=v.substring(4,6);t.value=f;},true);
document.addEventListener('focusout',e=>{const t=e.target;if(!t.classList||!t.classList.contains('time-input')||!t.value)return;
 if(t.value.length<8){const d=t.value.replace(/[^0-9]/g,'').padEnd(6,'0');t.value=d.substring(0,2)+':'+d.substring(2,4)+'.'+d.substring(4,6);t.dispatchEvent(new Event('input',{bubbles:true}));}
 const ok=/^\d{2}:[0-5]\d\.\d{2}$/.test(t.value);t.setCustomValidity(ok?'':'Format requis : MM:SS.CC (ex. 00:49.40)');t.style.borderColor=ok?'':'#E2001A';if(!ok)t.reportValidity();},true);
// Valeurs chiffrées des indicateurs : nombre seul (signe et décimale autorisés), l'unité est saisie à part
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('num-input'))return;
 let v=t.value.replace(/[^0-9.,+\-]/g,'');const sg=/^[+\-]/.test(v)?v[0]:'';v=v.replace(/[+\-]/g,'');const i=v.search(/[.,]/);if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/[.,]/g,'');t.value=sg+v;},true);
function bind(el){ // data-p = chemin dans l'état
  el.querySelectorAll('[data-p]').forEach(f=>{
    const get=()=>f.dataset.p.split('.').reduce((o,k)=>o?.[k],S());
    if(f.type==='checkbox') f.checked=!!get(); else f.value=get()??'';
    f.addEventListener(f.tagName==='SELECT'||f.type==='checkbox'?'change':'input',()=>{
      const ks=f.dataset.p.split('.'); const last=ks.pop(); const o=ks.reduce((o,k)=>o[k],S());

    });
  });
}

  ${!a.st?'<p class="hint" style="margin-top:6px">Choisir un statut pour construire l’action, l’écarter, ou la garder pour plus tard.</p>':''}`

function normRang(){const P=S().constats.map((c,i)=>({c,i})).filter(x=>x.c.a&&x.c.a.st==='prio').sort((x,y)=>(+x.c.a.rang||999)-(+y.c.a.rang||999)||x.i-y.i);P.forEach((x,n)=>x.c.a.rang=String(n+1));return P;}

 const row=({c,i})=>{const a=c.a;const svc=isCollC(c)&&MIX();

    ath.forEach(x=>{x.classList.add('row-ath');tb.append(x);});
    tb.append(grp('g-m',t.dataset.ref||((r.tag||'Référence mondiale')+' · '+(r.tagd||('podium '+r.monde.comp)))));
    ref.forEach(x=>{x.classList.add('row-ref');tb.append(x);});
    if(hors.length){tb.append(grp('g-h','Pour information (hors référence)'));hors.forEach(x=>tb.append(x));}
  });
}
function render(){renderSteps();const m=document.getElementById('main');const pid=ORDER()[step];CTX=pid===2?((ATH[cur].coll||MIX())?'coll':null):pid===9?'ind':pid===8?'coll':null;m.innerHTML=PAGES[pid]()+nav()+(IMPORT?'':'<p class="foot">Prototype de présentation. Données de la page 2 : Espadon, World Aquatics, PDF Omega (European Aquatics), profils de performance EL 2026. Rien n’est enregistré ni envoyé.</p>');bind(m);if(pid===7){fitBilan(m);scaleBilan();}if(pid===1){tabifyBilan(m);splitResultTables(m);m.querySelectorAll('.tw table').forEach(t=>{const n=Math.max(...[...t.querySelectorAll('tr')].map(r=>r.children.length));if(n>=7)t.classList.add('dense');if(n>=11)t.classList.add('xdense');});}}
// ===== Pré-remplissage : questionnaire généré depuis le dashboard (balise #embedded-data) =====
// IMPORT = { discipline, genere_le, admin:{…}, analyse:{saison, competition_reference, donnees:{…}} | null, precedent:{…} | null }
let IMPORT=null;
try{const t=(document.getElementById('embedded-data')||{}).textContent||'';if(t.trim())IMPORT=JSON.parse(t);}catch(e){IMPORT=null;}
const DEMO_PAR_DISC={'natation-bassin':'ex_nc','eau-libre':'ex_el','synchro':'ex_na','plongeon':'ex_pl','water-polo':'wp'};
// Page 2 : blocs {type:'epreuve',titre} | {type:'tableau',titre,colonnes,lignes,athlete:[i],hors:[i],note} | {type:'texte',titre,texte} | {type:'html',titre,html}
// Blocs graphiques de la page 2 importée : « barres » (phases) et « courbe » (positions tour par tour)
const SCOL=['var(--s1)','var(--s3)','var(--s2)','var(--s4)','var(--s5)'];
const legende=L=>`<div class="legend">${L.map((n,i)=>`<span><span class="sw" style="background:${SCOL[i%SCOL.length]}"></span>${esc(n)}</span>`).join('')}</div>`;
const nb=v=>v===null||v===undefined||v===''?null:+String(v).replace(',','.');
function barresSvg(ph,series){const V=ph.valeurs.map(nb),ok=V.filter(v=>v!==null&&!isNaN(v));if(!ok.length)return '';
 const mn=Math.min(...ok)/2,mx=Math.max(...ok),H=96,base=114,w=34,g=2,x0=(300-(V.length*(w+g)-g))/2;
 const y=v=>base-(v-mn)/((mx-mn)||1)*H;
 return `<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="${esc(ph.nom)}"><line x1="4" x2="296" y1="${base}" y2="${base}" stroke="var(--grid)"/><text x="4" y="${base-3}">${+mn.toFixed(2)}</text><line x1="4" x2="296" y1="18" y2="18" stroke="var(--grid)"/><text x="4" y="15">${mx}</text>`
  +V.map((v,i)=>{if(v===null||isNaN(v))return '';const x=x0+i*(w+g),t=y(v);return `<g><title>${esc(series[i]||'')} : ${v}${ph.unite?' '+esc(ph.unite):''}</title><rect x="${x}" y="${t}" width="${w}" height="${base-t}" rx="4" fill="${SCOL[i%SCOL.length]}"/></g><text x="${x+w/2}" y="${t-4}" text-anchor="middle" style="fill:var(--text-primary)">${v}</text>`;}).join('')+'</svg>';}
function blocBarres(b){const S=b.series||[];
 const ph=p=>{const V=p.valeurs.map(nb);const a=V[0],autres=V.slice(1).filter(v=>v!==null&&!isNaN(v));let ec='';
  if(a!==null&&!isNaN(a)&&autres.length){const best=p.plus_haut_meilleur?Math.max(...autres):Math.min(...autres);const d=a-best;const pire=p.plus_haut_meilleur?d<0:d>0;
   ec=`<b class="${d===0?'':pire?'pos':'neg'}">${d>0?'+':d<0?'−':'±'}${Math.abs(d).toFixed(2)}${p.unite?' '+esc(p.unite):''}</b>`;}
  return `<div class="ph"><div class="lab"><span>${esc(p.nom)}</span>${ec}</div>${barresSvg(p,S)}</div>`;};
 return `<div class="card">${b.titre?`<h2>${esc(b.titre)}</h2>`:''}${legende(S)}<div class="lens">${(b.groupes||[]).map(G=>`<div class="len">${G.titre?`<h3>${esc(G.titre)}</h3>`:''}<div class="row3">${(G.phases||[]).map(ph).join('')}</div></div>`).join('')}</div>${b.note?`<p class="note">${esc(b.note)}</p>`:''}</div>`;}
function blocCourbe(b){const A=b.axe||[],S=b.series||[];const all=S.flatMap(s=>(s.valeurs||[]).map(nb)).filter(v=>v!==null&&!isNaN(v));if(!A.length||!all.length)return '';
 const inv=b.inverse!==false,mn=inv?1:Math.min(...all),mx=Math.max(...all),L=44,R=626,T=24,B=160;
 const X=i=>L+(A.length>1?i*(R-L)/(A.length-1):0),Y=v=>inv?T+(v-mn)/((mx-mn)||1)*(B-T):B-(v-mn)/((mx-mn)||1)*(B-T);
 const ticks=inv?[1,...[5,10,15,20,25,30,40,50,60,70,80].filter(t=>t<=mx)]:[mn,(mn+mx)/2,mx];
 let h=`<svg viewBox="0 0 640 192" width="100%" role="img" aria-label="${esc(b.titre||'courbe')}">`+ticks.map(t=>`<line x1="${L}" x2="${R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${+(+t).toFixed(2)}</text>`).join('')
  +A.map((a,i)=>`<text x="${X(i)}" y="178" text-anchor="middle">${esc(a)}</text>`).join('')+(b.etiquette_axe?`<text x="${R}" y="190" text-anchor="end" style="font-size:10px">${esc(b.etiquette_axe)}</text>`:'');
 S.forEach((s,k)=>{const c=SCOL[k%SCOL.length];const P=(s.valeurs||[]).map((v,i)=>({i,v:nb(v)})).filter(p=>p.v!==null&&!isNaN(p.v));
  P.forEach((p,j)=>{if(j)h+=`<line x1="${X(P[j-1].i)}" y1="${Y(P[j-1].v)}" x2="${X(p.i)}" y2="${Y(p.v)}" stroke="${c}" stroke-width="2"${p.i-P[j-1].i>1?' stroke-dasharray="4 3"':''}/>`;
   h+=`<g><title>${esc(s.nom)} — ${esc(A[p.i])} : ${p.v}</title><circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3.5" fill="${c}"/></g>`;});});
 return `<div class="card">${b.titre?`<h2>${esc(b.titre)}</h2>`:''}${legende(S.map(s=>s.nom))}${h}</svg>${b.note?`<p class="note">${esc(b.note)}</p>`:''}</div>`;}
function blocsVersHtml(B){return (B||[]).map(b=>{
 if(b.type==='epreuve')return `<div class="grph">${esc(b.titre)}</div>`;
 if(b.type==='tableau'){const ath=b.athlete||[],hors=b.hors||[];
  const rows=(b.lignes||[]).map((l,i)=>`<tr>${l.map((c,j)=>`<td>${j===0&&ath.includes(i)?'<b>'+esc(c)+'</b> (athlète)':j===0&&hors.includes(i)?esc(c)+' (hors référence)':esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="card"><h2>${esc(b.titre||'')}</h2><div class="tw"><table><tbody><tr>${(b.colonnes||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows}</tbody></table></div>${b.note?`<p class="note">${esc(b.note)}</p>`:''}</div>`;}
 if(b.type==='barres')return blocBarres(b);
 if(b.type==='courbe')return blocCourbe(b);
 if(b.type==='texte')return `<div class="card">${b.titre?`<h2>${esc(b.titre)}</h2>`:''}<p style="white-space:pre-line;margin:0">${esc(b.texte)}</p></div>`;
 if(b.type==='html')return b.titre?`<div class="card"><h2>${esc(b.titre)}</h2>${b.html||''}</div>`:(b.html||'');
 return '';}).join('');}
function appliquerImport(){const I=IMPORT;
 const D2=[I.discipline,I.discipline_2].sort().join('+');DOUBLE=D2==='eau-libre+natation-bassin';
 const k=DOUBLE?'ex_nc':(DEMO_PAR_DISC[I.discipline]||'ex_nc');cur=k;
 const dimsDouble=DOUBLE?[...new Set([...ATH.ex_nc.dims,...ATH.ex_el.dims])]:null;
 Object.keys(ATH).forEach(x=>{if(x!==k)delete ATH[x];});
 const ad=I.admin||{},A=ATH[k],an=I.analyse&&I.analyse.donnees;
 A.nom=[ad.prenom,ad.nom].filter(Boolean).join(' ')||'Athlète';
 if(DOUBLE){A.disc='Natation course + Eau libre';A.dims=dimsDouble;}
 const tpl=document.createElement('template');tpl.id='tpl-import';document.body.appendChild(tpl);A.tpl='tpl-import';delete A.fictif;
 if(an){A.epr=an.epreuves||'';A.ref=I.analyse.competition_reference||'';
  REFS[k]={saison:an.saison||{comp:A.ref,date:'',epr:'',res:''},tag:(an.reference||{}).tag,tagd:(an.reference||{}).tagd,monde:an.reference||{comp:'',date:'',epr:'',res:''},src:an.sources||[],autres:an.references_supplementaires||[]};
  KPI[k]=an.kpi||[];EPREF[k]=an.epreuves_liste||(an.blocs||[]).filter(b=>b.type==='epreuve').map(b=>b.titre);
  tpl.innerHTML=blocsVersHtml(an.blocs);}
 else{A.epr=ad.epreuves||'';A.ref='';REFS[k]={saison:{comp:'Compétition de référence',q:'sur la saison écoulée',date:'à venir',epr:'',res:''},tag:'Référence',monde:{comp:'À venir',date:'',epr:'',res:''},src:[]};KPI[k]=[];EPREF[k]=[];
  tpl.innerHTML='<div class="card"><p class="empty">Données d’analyse de la compétition de référence à venir : elles seront ajoutées par la DTN.</p></div>';}
 const s=S();if(DOUBLE){s.perf.d1=WC27.el[0];s.perf.d2=WC27.nc[1];}Object.assign(s.adm,{lic:ad.licence||'',nom:ad.nom||'',prenom:ad.prenom||'',ddn:ad.date_naissance||'',genre:ad.genre||'',email:ad.email||'',tel:ad.telephone||'',club:ad.club||'',
  struct:ad.structure_nom||'',ent:ad.entraineur_nom||'',entEmail:ad.entraineur_email||'',entTel:ad.entraineur_tel||'',staff:ad.staff||'',
  etr:!!ad.entrainement_etranger,structFr:ad.structure_france||'',entFr:ad.entraineur_france||''});
 if(I.precedent&&(I.precedent.items||[]).length)s.prec={date:I.precedent.date||'',version:I.precedent.version||'',items:I.precedent.items.map(x=>({type:x.type,libelle:x.libelle||'',cible:x.cible||'',realise:'',com:''}))};
 document.querySelector('.athbar').style.display='none';
 document.querySelector('.proto').textContent='Questionnaire pré-rempli'+(I.genere_le?' le '+fmtD(String(I.genere_le).slice(0,10)):'')+' · envoi par le bouton de la page « Bilan PDF »';}
