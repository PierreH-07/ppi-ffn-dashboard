<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard PPI — FFN DTN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy:#0B1F5C; --navy-2:#142B7B; --blue:#00AEEF; --blue-d:#0080BE;
  --blue-bg:#E8F6FD; --red:#D7282F; --green:#6CB33F; --ocre:#C98A3C;
  --violet:#663F9E; --pink:#FF6B9D;
  --text:#0E1A3C; --text-2:#4A5478; --muted:#7C88A6;
  --line:#E3EAF2; --line-2:#EFF3F8; --bg:#F0F4F9;
  --card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ── LOGIN ── */
#login-screen {
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#1a3a8a 100%);
}
.login-box {
  background:#fff;border-radius:16px;padding:40px 44px;width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.login-logo {
  text-align:center;margin-bottom:28px;
}
.login-logo .ffn-badge {
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;
  color:#fff;margin-bottom:12px;
}
.login-logo h1 {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--navy);
}
.login-logo p {
  font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;
}
.login-field {margin-bottom:16px}
.login-field label {
  display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px;
}
.login-field input {
  width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;
  font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);
  transition:border-color .2s;outline:none;
}
.login-field input:focus{border-color:var(--blue)}
.login-btn {
  width:100%;padding:12px;background:var(--navy);color:#fff;border:none;
  border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  transition:background .2s;margin-top:8px;
}
.login-btn:hover{background:var(--navy-2)}
.login-error {
  background:#FDECEA;border:1px solid #F5C6C6;border-radius:6px;
  padding:10px 12px;font-size:12px;color:var(--red);margin-top:12px;display:none;
}

/* ── APP LAYOUT ── */
#app {display:none;min-height:100vh;flex-direction:column}

/* Header */
.app-header {
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;
  border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:100;
}
.app-header .ffn-badge {
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;flex-shrink:0;
}
.app-header h1 {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;
  text-transform:uppercase;letter-spacing:.04em;flex:1;
}
.app-header .eyebrow {
  font-size:8px;letter-spacing:.25em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-bottom:1px;
}
.search-bar {
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:6px 14px;
}
.search-bar input {
  background:none;border:none;outline:none;color:#fff;
  font-family:'Barlow',sans-serif;font-size:13px;width:200px;
}
.search-bar input::placeholder{color:rgba(255,255,255,.4)}
.search-bar svg{opacity:.5;flex-shrink:0}
.disc-filter {display:flex;gap:6px}
.disc-chip {
  padding:4px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.25);
  background:transparent;color:rgba(255,255,255,.6);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
}
.disc-chip.active,.disc-chip:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.logout-btn {
  padding:6px 14px;border:1.5px solid rgba(255,255,255,.25);border-radius:999px;
  background:transparent;color:rgba(255,255,255,.7);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
}
.logout-btn:hover{background:rgba(255,255,255,.1)}

/* Main body */
.app-body {flex:1;display:flex;overflow:hidden;height:calc(100vh - 67px)}

/* ── NAGEUR LIST ── */
.nageur-list {
  width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  overflow-y:auto;display:flex;flex-direction:column;
}
.list-header {
  padding:14px 16px;border-bottom:1px solid var(--line);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;
}
.list-count {
  background:var(--blue-bg);color:var(--blue-d);
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;
  padding:2px 8px;border-radius:999px;
}
.nageur-card {
  padding:14px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;
  transition:background .15s;display:flex;gap:12px;align-items:center;
}
.nageur-card:hover{background:var(--blue-bg)}
.nageur-card.active{background:var(--blue-bg);border-left:3px solid var(--blue)}
.nageur-avatar {
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:#fff;
}
.nageur-card-info .name {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;
  color:var(--navy);text-transform:uppercase;letter-spacing:.02em;
}
.nageur-card-info .sub {font-size:11px;color:var(--muted);margin-top:1px}
.nageur-card-info .badges {display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:3px;
}
.badge-disc{background:var(--navy);color:#fff}
.badge-club{background:var(--line-2);color:var(--text-2)}

/* ── FICHE NAGEUR ── */
.fiche-container {
  flex:1;overflow-y:auto;padding:24px 28px;
  background:var(--bg);
}
.fiche-empty {
  display:flex;align-items:center;justify-content:center;height:100%;
  flex-direction:column;gap:12px;color:var(--muted);
}
.fiche-empty .ico {font-size:48px;opacity:.3}
.fiche-empty p {font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}

/* Sections */
.fiche-section {margin-bottom:20px}
.fiche-section-title {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;
  text-transform:uppercase;letter-spacing:.15em;color:var(--navy);
  padding-bottom:8px;border-bottom:2px solid var(--navy);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.fiche-section-title .num {
  width:22px;height:22px;background:var(--navy);color:#fff;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;flex-shrink:0;
}

/* Cards */
.card {background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.card-title {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--navy);
  margin-bottom:12px;padding-bottom:6px;border-bottom:1px dashed var(--line);
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* Identity header */
.identity-header {
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
  border-radius:12px;padding:20px 24px;display:grid;
  grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  margin-bottom:20px;
}
.identity-avatar {
  width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;color:#fff;
  border:3px solid rgba(255,255,255,.3);
}
.identity-name {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;
  text-transform:uppercase;letter-spacing:.02em;color:#fff;line-height:1;
}
.identity-disc {
  display:inline-block;margin-top:6px;padding:3px 10px;border-radius:3px;
  background:var(--blue);font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#fff;
}
.identity-meta {display:flex;flex-direction:column;gap:4px}
.identity-meta-row {
  display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);
}
.identity-meta-row strong{color:#fff;font-weight:600}
.identity-right {text-align:right}
.identity-licence {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);
}
.identity-licence span {
  display:block;font-size:16px;color:#fff;letter-spacing:.05em;margin-top:2px;
}
.updated-at {font-size:10px;color:rgba(255,255,255,.4);margin-top:8px}

/* Field display */
.field-row {display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field-row:last-child{margin-bottom:0}
.field-label {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
}
.field-value {font-size:13px;color:var(--text);font-weight:500;line-height:1.4}
.field-value.empty{color:var(--muted);font-style:italic}

/* Staff cards */
.staff-grid{display:flex;flex-wrap:wrap;gap:10px}
.staff-card {
  background:var(--blue-bg);border:1px solid #BEE6F7;border-radius:8px;
  padding:10px 14px;flex:1;min-width:160px;
}
.staff-card .role {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--blue-d);margin-bottom:4px;
}
.staff-card .staff-name {font-weight:600;font-size:13px;color:var(--navy)}
.staff-card .staff-contact {font-size:11px;color:var(--muted);margin-top:2px}
.staff-card.lead {background:var(--navy);border-color:var(--navy)}
.staff-card.lead .role{color:rgba(255,255,255,.6)}
.staff-card.lead .staff-name,.staff-card.lead .staff-contact{color:#fff}

/* Bilan bars */
.bilan-bar-row {margin-bottom:10px}
.bilan-bar-row:last-child{margin-bottom:0}
.bilan-bar-header {
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;
}
.bilan-bar-label {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;
  text-transform:uppercase;letter-spacing:.12em;color:var(--text-2);
}
.bilan-bar-val {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;color:var(--navy);
}
.bilan-bar-track {
  height:10px;background:var(--line);border-radius:5px;overflow:hidden;
}
.bilan-bar-fill {
  height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--blue-d),var(--blue));
}

/* Semaine type */
.semaine-grid {display:flex;flex-direction:column;gap:6px}
.semaine-row {display:grid;grid-template-columns:44mm 1fr 16mm;gap:8px;align-items:center}
.semaine-label {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);
}
.semaine-bar-track {height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.semaine-bar-fill {height:100%;border-radius:5px}
.semaine-val {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  color:var(--navy);text-align:right;
}

/* Séparation */
.sep-grid {display:grid;grid-template-columns:auto 1fr 1fr;gap:0}
.sep-horizon {
  grid-column:1;padding:12px 16px 12px 0;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;
  text-transform:uppercase;letter-spacing:.12em;color:var(--navy);
  border-right:3px solid var(--navy);display:flex;align-items:center;
  writing-mode:vertical-rl;transform:rotate(180deg);
}
.sep-cell {
  padding:10px 14px;border-bottom:1px solid var(--line-2);
  border-right:1px solid var(--line-2);
}
.sep-cell:nth-child(3n){border-right:none}
.sep-cell-label {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;
}
.sep-cell.entrain{background:#E8F6FD}
.sep-cell.environ{background:#FFF8E1}
.sep-val {font-size:12px;color:var(--text);line-height:1.4}

/* Dimensions */
.dims-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dim-card {
  border-radius:10px;overflow:hidden;border:1px solid var(--line);
}
.dim-card-header {
  padding:12px 14px;display:flex;align-items:center;gap:10px;
}
.dim-num {
  font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;
  font-size:28px;color:#fff;line-height:1;min-width:24px;
}
.dim-name {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;
  text-transform:uppercase;letter-spacing:.08em;color:#fff;
}
.dim-card-body {padding:12px 14px;background:#fff}
.dim-section-label {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;
}
.dim-action {font-size:12px;color:var(--text);margin-bottom:10px;line-height:1.4}
.dim-attendus {
  font-size:11px;color:var(--text-2);font-style:italic;line-height:1.4;
  padding-top:8px;border-top:1px dashed var(--line);
}

/* Timeline projection */
.proj-timeline {display:flex;gap:0;position:relative;padding:20px 0 10px;overflow-x:auto}
.proj-timeline::before {
  content:'';position:absolute;top:32px;left:20px;right:20px;height:3px;
  background:linear-gradient(90deg,var(--green),var(--blue) 50%,var(--red));
  border-radius:2px;
}
.proj-year {
  flex:1;min-width:80px;display:flex;flex-direction:column;
  align-items:center;gap:6px;position:relative;
}
.proj-year-num {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;
  color:var(--navy);line-height:1;
}
.proj-year.jo .proj-year-num{color:var(--red)}
.proj-dot {
  width:14px;height:14px;border-radius:50%;background:var(--blue);
  border:3px solid #fff;box-shadow:0 0 0 2px var(--blue);z-index:1;
}
.proj-year.jo .proj-dot{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.proj-comp {
  font-size:10px;text-align:center;color:var(--text-2);line-height:1.3;
  font-weight:500;max-width:90px;
}
.proj-epreuves {display:flex;flex-direction:column;gap:2px;align-items:center}
.proj-epreuve {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;
  color:var(--blue-d);letter-spacing:.04em;
}

/* Compétitions objectif */
.comp-cards {display:flex;flex-wrap:wrap;gap:10px}
.comp-card {
  flex:1;min-width:180px;background:#fff;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;
}
.comp-card-header {
  padding:8px 12px;display:flex;align-items:center;gap:8px;
}
.comp-prio {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:8px;
  letter-spacing:.15em;text-transform:uppercase;padding:2px 6px;border-radius:3px;
}
.comp-prio-a{background:var(--red);color:#fff}
.comp-prio-b{background:var(--ocre);color:#fff}
.comp-prio-c{background:var(--green);color:#fff}
.comp-card-name {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;
  color:var(--navy);text-transform:uppercase;
}
.comp-card-dates {font-size:10px;color:var(--muted);padding:0 12px 8px}
.comp-card-epreuves {
  border-top:1px solid var(--line-2);padding:8px 12px;
  display:flex;flex-direction:column;gap:3px;
}
.comp-epreuve-row {
  display:flex;justify-content:space-between;font-size:11px;
}
.comp-epreuve-name{color:var(--text-2)}
.comp-epreuve-perf{font-weight:600;color:var(--navy)}

/* FullCalendar overrides */
.fc {font-family:'Barlow',sans-serif;font-size:12px}
.fc-toolbar-title {
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--navy);
}
.fc-button {
  background:var(--navy) !important;border-color:var(--navy) !important;
  font-family:'Barlow Condensed',sans-serif !important;font-weight:700 !important;
  font-size:10px !important;letter-spacing:.1em !important;text-transform:uppercase !important;
}
.fc-button:hover{background:var(--navy-2) !important;border-color:var(--navy-2) !important}
.fc-event {border-radius:3px !important;border:none !important;font-size:10px !important}
.fc-daygrid-event-dot{display:none}

/* Charte */
.charte-signataires {display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.signataire {
  background:var(--blue-bg);border:1px solid #BEE6F7;border-radius:8px;
  padding:12px 14px;text-align:center;
}
.signataire-role {
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--blue-d);margin-bottom:6px;
}
.signataire-name {font-weight:600;font-size:13px;color:var(--navy)}
.signataire-date {font-size:11px;color:var(--muted);margin-top:3px}

/* Loading */
.loading {
  display:flex;align-items:center;justify-content:center;
  height:200px;gap:10px;color:var(--muted);
}
.spinner {
  width:20px;height:20px;border:2px solid var(--line);
  border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="ffn-badge">FFN</div>
      <h1>Dashboard PPI</h1>
      <p>Direction Technique Nationale</p>
    </div>
    <div class="login-field">
      <label>Adresse email</label>
      <input type="email" id="login-email" placeholder="prenom.nom@ffnatation.fr" autocomplete="email">
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()">Se connecter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="ffn-badge">FFN</div>
    <div>
      <div class="eyebrow">Direction Technique Nationale</div>
      <h1>Plans de Performance Individuels</h1>
    </div>

/*
 * PROCÉDURE D'INVITATION D'UN ENTRAÎNEUR :
 * 1. Supabase → Authentication → Users → "Invite user" → saisir l'email
 * 2. L'entraîneur reçoit un mail et crée son mot de passe
 * 3. Récupérer son UUID dans Authentication → Users
 * 4. Exécuter dans SQL Editor :
 *    INSERT INTO utilisateurs (id, email, role)
 *    VALUES ('<uuid>', 'email@club.fr', 'entraineur');

// ══ CONFIG SUPABASE ══
const SUPABASE_URL  = 'https://nyasokzqnuhngfwpnmhg.supabase.co';

// ══ AUTH ══
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  if (!email || !pass) {
    errEl.textContent = 'Veuillez saisir votre email et mot de passe.';
    errEl.style.display = 'block';
    return;
  }

  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    errEl.textContent = 'Email ou mot de passe incorrect.';
    errEl.style.display = 'block';
    return;
  }

  await initSession();
}

async function initSession() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  // Récupérer le rôle depuis la table utilisateurs
  const { data: userData, error } = await sb
    .from('utilisateurs')
    .select('role')
    .eq('id', user.id)
    .single();

  if (error || !userData) {
    // Pas de rôle configuré → refuser l'accès
    await sb.auth.signOut();
    const errEl = document.getElementById('login-error');
    if (errEl) {
      errEl.textContent = 'Compte non autorisé. Contactez la DTN.';
      errEl.style.display = 'block';
    }
    return;
  }

  currentUser = { email: user.email, role: userData.role };
  showApp();
}

async function doLogout() {
  await sb.auth.signOut();
  currentUser = null;
  allNageurs = [];
  allNagueursByKey = {};
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';

}

async function showApp() {
  document.getElementById('login-screen').style.display = 'none';

}

async function doChangePassword() {

// ══ GESTION RESET PASSWORD ══
// Détecter si l'URL contient un token de type "recovery" (lien reset Supabase)
async function handleAuthRedirect() {
  // Format 1 : ?code=xxx (mode PKCE — le plus courant)
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  if (code) {
    const { error } = await sb.auth.exchangeCodeForSession(code);
    // Nettoyer l'URL
    window.history.replaceState({}, document.title,
      window.location.pathname + window.location.hash.replace(/#.*/, ''));

    if (error) {
      const errEl = document.getElementById('login-error');
      if (errEl) {
        errEl.textContent = 'Lien invalide ou expiré. Contactez votre administrateur.';
        errEl.style.display = 'block';
      }
      return false;
    }

    // Vérifier le type de flow (recovery = reset password)
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user?.recovery_sent_at) {
      showResetPasswordScreen();
      return true;
    }

    // Sinon c'est une invitation → afficher reset password aussi
    // (premier accès = définir son mot de passe)
    showResetPasswordScreen();
    return true;
  }

  // Format 2 : #access_token=xxx (mode implicite — ancien format)
  const hash = window.location.hash;
  if (hash) {
    const params = new URLSearchParams(hash.substring(1));

    if (params.get('error')) {
      window.location.hash = '';
      const errEl = document.getElementById('login-error');
      if (errEl) {
        const code = params.get('error_code') || '';
        errEl.textContent = code === 'otp_expired'
          ? 'Le lien a expiré. Contactez votre administrateur pour en recevoir un nouveau.'
          : `Erreur : ${(params.get('error_description') || '').replace(/\+/g, ' ')}`;
        errEl.style.display = 'block';
      }
      return false;
    }

    const type  = params.get('type');
    const token = params.get('access_token');
    if (type === 'recovery' && token) {
      const { error } = await sb.auth.setSession({
        access_token:  token,
        refresh_token: params.get('refresh_token') || ''
      });
      window.location.hash = '';
      if (error) {
        const errEl = document.getElementById('login-error');
        if (errEl) {
          errEl.textContent = 'Lien expiré. Contactez votre administrateur.';
          errEl.style.display = 'block';
        }
        return false;
      }
      showResetPasswordScreen();
      return true;
    }
  }

  return false;
}

async function doResetPassword() {
  const p1    = document.getElementById('reset-pass-1').value;

handleAuthRedirect().then(isReset => {

// ══ DONNÉES ══
function makeNageurKey(nom, dateNaissance) {
  const n = (nom || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').trim()
    .replace(/\s+/g, '_');
  const d = (dateNaissance || '').trim();
  return `${n}_${d}`;
}

async function loadNageurs() {
  let query = sb
    .from('ppi_nageurs')
    .select('*')
    .order('date_export', { ascending: false });

  // Entraîneur : filtrer sur son email uniquement
  if (currentUser.role !== 'dtn') {
    query = query.ilike('entraineur_email', currentUser.email);
  }

  const { data, error } = await query;
  if (error) { console.error(error); return; }

  const rows = data || [];

  // Grouper par nageur_key : 1 groupe = 1 nageur, trié du plus récent au plus ancien
  allNagueursByKey = {};
  rows.forEach(r => {
    const key = makeNageurKey(r.nom, r.date_naissance);
    if (!allNagueursByKey[key]) allNagueursByKey[key] = [];
    allNagueursByKey[key].push(r);
  });

  // Une entrée par nageur = la version la plus récente
  allNageurs = Object.values(allNagueursByKey)
    .map(versions => versions[0])
    .sort((a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr'));

  buildDiscFilter();
  renderList(allNageurs);
}

function buildDiscFilter() {
  const discs = [...new Set(allNageurs.map(n => n.discipline_label).filter(Boolean))];
  const bar = document.getElementById('disc-filter');
  bar.innerHTML = `<button class="disc-chip active" data-disc="all" onclick="setDiscFilter(this,'all')">Tous</button>`;
  discs.forEach(d => {
    const key = allNageurs.find(n => n.discipline_label === d)?.discipline || d;
    bar.innerHTML += `<button class="disc-chip" data-disc="${key}" onclick="setDiscFilter(this,'${key}')">${d}</button>`;
  });
}

function setDiscFilter(btn, disc) {
  document.querySelectorAll('.disc-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDisc = disc;
  filterNageurs();
}

function filterNageurs() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = allNageurs.filter(n => {
    const matchDisc = currentDisc === 'all' || n.discipline === currentDisc;
    const matchQ = !q || `${n.nom} ${n.prenom} ${n.club || ''} ${n.entraineur_nom || ''}`.toLowerCase().includes(q);
    return matchDisc && matchQ;
  });
  renderList(filtered);
}

function renderList(nageurs) {
  const el = document.getElementById('nageur-list-items');
  document.getElementById('list-count').textContent = nageurs.length;

  if (nageurs.length === 0) {
    el.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--muted);font-size:12px">Aucun nageur trouvé</div>';
    return;
  }

  const colors = ['#0B1F5C','#00AEEF','#D7282F','#6CB33F','#C98A3C','#663F9E','#FF6B9D'];
  el.innerHTML = nageurs.map((n, i) => {
    const initials = `${(n.prenom||'')[0]||''}${(n.nom||'')[0]||''}`.toUpperCase();
    const color = colors[i % colors.length];
    const nKey = makeNageurKey(n.nom, n.date_naissance);
    const vCount = (allNagueursByKey[nKey] || []).length;
    return `<div class="nageur-card" onclick="selectNageur('${nKey}')" id="card-${nKey}">
      <div class="nageur-avatar" style="background:${color}">${initials}</div>
      <div class="nageur-card-info">
        <div class="name">${n.prenom || ''} ${n.nom || ''}</div>
        <div class="sub">${n.entraineur_nom || 'Entraîneur non renseigné'}</div>
        <div class="badges">
          ${n.discipline_label ? `<span class="badge badge-disc">${n.discipline_label}</span>` : ''}
          ${n.club ? `<span class="badge badge-club">${n.club}</span>` : ''}
          ${vCount > 1 ? `<span class="badge" style="background:#EEF4FF;color:var(--navy-2)">${vCount} versions</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ══ FICHE NAGEUR ══
function selectNageur(nageurKey) {
  document.querySelectorAll('.nageur-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`card-${nageurKey}`);
  if (card) card.classList.add('active');

  selectedNageurKey = nageurKey;
  const versions = allNagueursByKey[nageurKey] || [];
  if (!versions.length) return;
  renderFiche(versions[0], versions, 0);
}

async function deleteVersion(id, nageurKey) {
  const versions = allNagueursByKey[nageurKey] || [];
  const n = versions.find(v => v.id === id);
  const label = n
    ? `le PPI du ${new Date(n.date_export).toLocaleDateString('fr-FR')} de ${n.prenom} ${n.nom}`
    : 'cette version';

  if (!confirm(`Supprimer définitivement ${label} ?\n\nCette action est irréversible.`)) return;

  const { error } = await sb.from('ppi_nageurs').delete().eq('id', id);
  if (error) { alert('Erreur lors de la suppression : ' + error.message); return; }

  // Mettre à jour le cache local
  allNagueursByKey[nageurKey] = versions.filter(v => v.id !== id);
  const remaining = allNagueursByKey[nageurKey];

  if (remaining.length === 0) {
    // Plus aucune version : retirer le nageur de la liste
    delete allNagueursByKey[nageurKey];
    allNageurs = allNageurs.filter(n => makeNageurKey(n.nom, n.date_naissance) !== nageurKey);
    renderList(allNageurs);
    document.getElementById('fiche-container').innerHTML =
      '<div class="fiche-empty"><div class="ico">👤</div><p>Sélectionnez un nageur</p></div>';
  } else {
    // Mettre à jour la version de référence dans allNageurs (toujours la plus récente)
    allNageurs = allNageurs.map(x =>
      makeNageurKey(x.nom, x.date_naissance) === nageurKey ? remaining[0] : x
    );
    // Re-rendre la liste et la fiche avec la version la plus récente
    renderList(allNageurs);
    // Réactiver la card
    const card = document.getElementById(`card-${nageurKey}`);
    if (card) card.classList.add('active');
    // Afficher la version la plus récente
    renderFiche(remaining[0], remaining, 0);
  }
}

                padding:10px 14px;background:var(--line-2);border-radius:8px;
                border:1px solid var(--line)">
      ${allVersions.length > 1 ? `

                     text-transform:uppercase;letter-spacing:.1em;white-space:nowrap">

          style="flex:1;font-size:12px;padding:4px 8px;border:1px solid var(--line);
                 border-radius:6px;background:#fff">
          ${allVersions.map((v, i) => {
            const d = v.date_export
              ? new Date(v.date_export).toLocaleDateString('fr-FR',
                  {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})
              : `Version ${i + 1}`;
            const isSelected = selectedIndex !== undefined ? i === selectedIndex : v.id === n.id;
            return `<option value="${i}" ${isSelected ? 'selected' : ''}>${i === 0 ? '✦ Dernière — ' : ''}${d}</option>`;
          }).join('')}
        </select>` : ''}
      <button id="btn-delete-version"
        style="padding:4px 10px;background:#FDECEA;color:var(--red);
               border:1px solid #F5C6C6;border-radius:6px;
               font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:auto">
        🗑 ${allVersions.length > 1 ? 'Supprimer cette version' : 'Supprimer ce PPI'}
      </button>
    </div>` : '';

  el.innerHTML = `
  ${versionsBar}
  <!-- IDENTITÉ -->
  <div class="identity-header">
    <div class="identity-avatar" style="background:${color}">${initials}</div>
    <div>
      <div class="identity-name">${n.prenom || ''} ${n.nom || ''}</div>
      ${n.discipline_label ? `<span class="identity-disc">${n.discipline_label}</span>` : ''}
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:3px">
        <div class="identity-meta-row">📧 <strong>${n.email || '—'}</strong></div>
        <div class="identity-meta-row">📱 <strong>${n.telephone || '—'}</strong></div>
        <div class="identity-meta-row">🏊 <strong>${n.club || '—'}</strong>${n.structure_nom ? ` · ${n.structure_nom}` : ''}</div>
        <div class="identity-meta-row">📅 <strong>${n.date_naissance ? new Date(n.date_naissance).toLocaleDateString('fr-FR') : '—'}</strong></div>
      </div>
    </div>
    <div class="identity-right">
      <div class="identity-licence">N° Licence<span>${n.licence || '—'}</span></div>
      <div class="updated-at">Mis à jour le ${updated}</div>
    </div>
  </div>

  <!-- SECTION 1 : ENVIRONNEMENT & STAFF -->
  ${renderSection(1, 'Environnement & Staff', renderStaff(n))}

  <!-- SECTION 2 : BILAN SAISON -->
  ${renderSection(2, 'Bilan saison 2025', renderBilan(n))}

  <!-- SECTION 3 : SEMAINE TYPE -->
  ${renderSection(3, 'Semaine type', renderSemaineType(n))}

  <!-- SECTION 4 : CE QUI ME SÉPARE -->
  ${renderSection(4, 'Ce qui me sépare de la performance', renderSeparation(n))}

  <!-- SECTION 5 : PROJECTION LONG TERME -->
  ${renderSection(5, 'Projection long terme 2026–2032', renderProjection(n))}

  <!-- SECTION 6 : COMPÉTITIONS SAISON 2026 -->
  ${renderSection(6, 'Compétitions saison 2026', renderCompetitions(n))}

  <!-- SECTION 7 : ACTIONS CLÉS & DIMENSIONS -->
  ${renderSection(7, 'Actions clés & Dimensions de développement', renderDimensions(n))}

  <!-- SECTION 8 : CALENDRIER -->
  ${renderSection(8, 'Calendrier', renderCalendrierSynthetique(n) + '<div id="calendar-container" style="min-height:400px"></div>')}

  <!-- SECTION 9 : CHARTE D\'ENGAGEMENT -->
  ${renderSection(9, "Charte d'engagement mutuel", renderCharte(n))}
  `;

  // Listeners versions et suppression (après injection HTML)
  requestAnimationFrame(() => {
    // Sélecteur de versions
    const selector = document.getElementById('version-selector');
    if (selector) {
      selector.addEventListener('change', () => {
        const idx = parseInt(selector.value);
        const vers = allNagueursByKey[nageurKey];
        if (vers && vers[idx]) {
          renderFiche(vers[idx], vers, idx);
        }
      });
    }

    // Bouton suppression
    const btnDelete = document.getElementById('btn-delete-version');
    if (btnDelete) {
      btnDelete.addEventListener('click', () => deleteVersion(n.id, nageurKey));
    }

    // Calendrier
    initCalendar(n);
  });
}

function renderSection(num, title, content) {
  return `<div class="fiche-section">
    <div class="fiche-section-title">
      <div class="num">${num}</div>${title}
    </div>
    ${content}
  </div>`;
}

function f(val, fallback='—') {
  return (val && String(val).trim()) ? val : `<span class="empty">${fallback}</span>`;
}

function field(label, val) {
  const v = (val && String(val).trim()) ? val : null;
  return `<div class="field-row">

    <div class="field-value${v ? '' : ' empty'}">${v || '—'}</div>

}

// ── Semaine type ──
function renderSemaineType(n) {
  // Défense : la colonne peut revenir comme string JSON si elle n'est pas jsonb
  let raw = n.semaine_type_data;
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch(e) { raw = {}; } }
  const data = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};

  // Volumes par catégorie (comptage des créneaux × 0.5h)
  const counts = { eau:0, physique:0, scolaire:0, recup:0, kine:0, mental:0 };
  Object.values(data).forEach(t => { if (t && counts[t] !== undefined) counts[t]++; });
  const volumes = Object.fromEntries(Object.entries(counts).map(([k,v]) => [k, v*0.5]));
  const total = Object.values(volumes).reduce((a,b)=>a+b,0);
  const maxV = Math.max(...Object.values(volumes), 1);

  const catConfig = [
    { id:'eau',      label:'Entraînement eau',    shortLabel:'EAU',      color:'#00AEEF', gradient:'linear-gradient(90deg,#0080BE,#00AEEF)', major:true  },
    { id:'physique', label:'Préparation physique', shortLabel:'PHYSIQUE', color:'#D7282F', gradient:'linear-gradient(90deg,#D7282F,#E55A60)', major:true  },
    { id:'scolaire', label:'Scolaire / Pro',        shortLabel:'SCOLAIRE', color:'#6CB33F', gradient:'linear-gradient(90deg,#6CB33F,#8DCB6E)', major:true  },
    { id:'recup',    label:'Récupération',          shortLabel:'RÉCUP',    color:'#7C88A6', gradient:'#7C88A6',                               major:false },
    { id:'kine',     label:'Kiné / Ostéo',          shortLabel:'KINÉ',     color:'#663F9E', gradient:'#663F9E',                               major:false },
    { id:'mental',   label:'Préparation mentale',   shortLabel:'MENTAL',   color:'#C98A3C', gradient:'#C98A3C',                               major:false },
  ];
  const colorById = Object.fromEntries(catConfig.map(c => [c.id, c.color]));
  const shortById = Object.fromEntries(catConfig.map(c => [c.id, c.shortLabel]));

  const barRows = catConfig.map(c => {
    const h = volumes[c.id].toFixed(1);
    const pct = Math.round(volumes[c.id] / maxV * 100);
    return `<div class="semaine-row">
      <div class="semaine-label" style="font-weight:${c.major?'800':'600'}">${c.label}</div>
      <div class="semaine-bar-track">
        <div class="semaine-bar-fill" style="width:${pct}%;${c.gradient.startsWith('linear') ? 'background-image:'+c.gradient : 'background-color:'+c.gradient}"></div>
      </div>
      <div class="semaine-val">${h}h</div>
    </div>`;
  }).join('');

  // ── Grille emploi du temps ──
  // Format réel : clé = "dayIndex_slotIndex"
  // dayIndex 0–6 (0=Lun … 6=Dim), slotIndex 0–31 (0=06h00, 1=06h30 … 31=21h30)
  const DAY_LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const slotToLabel = s => {
    const min = 6 * 60 + s * 30;
    return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
  };

  const activeDaySet = new Set();
  const activeSlotSet = new Set();
  const cellMap = {};

  Object.entries(data).forEach(([key, type]) => {
    if (!type) return;
    const [di, si] = key.split('_').map(Number);
    if (isNaN(di) || isNaN(si) || di < 0 || di > 6 || si < 0 || si > 31) return;
    activeDaySet.add(di);
    activeSlotSet.add(si);
    cellMap[key] = type;
  });

  const activeDayIndices = [...activeDaySet].sort((a,b) => a-b);
  const activeSlots     = [...activeSlotSet]
    .filter(s => activeDayIndices.some(d => cellMap[`${d}_${s}`]))
    .sort((a,b) => a-b);

  // Build diagnostic info for when grid is empty
  const rawKeyCount = Object.keys(data).length;
  const rawSample   = Object.entries(data).slice(0,4).map(([k,v]) => `"${k}"→"${v}"`).join(', ');
  const emptyHtml   = rawKeyCount === 0
    ? `<div style="margin-top:12px;padding:10px 14px;background:var(--line-2);border-radius:6px;font-size:11px;color:var(--muted)">Emploi du temps non renseigné</div>`
    : `<div style="margin-top:12px;padding:10px 14px;background:#fff3cd;border-radius:6px;font-size:11px;color:#856404">
         <strong>Format non reconnu</strong> (${rawKeyCount} entrées). Exemples : ${rawSample}
       </div>`;

  const timetableHtml = activeSlots.length > 0 ? `
    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;
                  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">
        Emploi du temps type
      </div>
      <div style="overflow-x:auto">
        <table style="border-collapse:collapse;font-size:10px;width:100%">
          <thead>
            <tr>
              <th style="padding:4px 8px;background:var(--navy);color:rgba(255,255,255,.5);
                         font-family:'Barlow Condensed',sans-serif;font-size:8px;
                         text-align:left;min-width:44px;border-right:2px solid rgba(255,255,255,.15)"></th>
              ${activeDayIndices.map(di => `
                <th style="padding:4px 6px;background:var(--navy);color:#fff;
                           font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;
                           letter-spacing:.08em;text-transform:uppercase;text-align:center;
                           min-width:56px;border-right:1px solid rgba(255,255,255,.1)">${DAY_LABELS[di]}</th>
              `).join('')}
            </tr>
          </thead>
          <tbody>
            ${activeSlots.map((s, ri) => {
              const rowBg = ri % 2 === 0 ? 'var(--line-2)' : '#fff';
              return `<tr>
                <td style="padding:2px 8px 2px 6px;font-family:'Barlow Condensed',sans-serif;
                           font-size:8px;font-weight:700;color:var(--muted);background:${rowBg};
                           white-space:nowrap;border-right:2px solid var(--line)">${slotToLabel(s)}</td>
                ${activeDayIndices.map(di => {
                  const type = cellMap[`${di}_${s}`] || null;
                  if (!type) return `<td style="padding:2px 3px;background:${rowBg};border-right:1px solid var(--line-2)"></td>`;
                  const col = colorById[type] || '#aaa';
                  const lbl = shortById[type] || type.toUpperCase().slice(0,3);
                  return `<td style="padding:2px 3px;background:${col}18;border-right:1px solid ${col}30">
                    <div style="background:${col};border-radius:3px;padding:2px 4px;
                                font-family:'Barlow Condensed',sans-serif;font-size:7px;
                                font-weight:800;color:#fff;text-align:center;
                                letter-spacing:.04em;text-transform:uppercase">${lbl}</div>
                  </td>`;
                }).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
        ${catConfig.filter(c => volumes[c.id] > 0).map(c => `
          <div style="display:flex;align-items:center;gap:4px">
            <div style="width:10px;height:10px;border-radius:2px;background:${c.color};flex-shrink:0"></div>
            <span style="font-size:10px;color:var(--text-2)">${c.label}</span>
          </div>
        `).join('')}
      </div>
    </div>` : emptyHtml;

  return `<div class="card">
    <div style="display:flex;gap:20px;align-items:center">
      <div class="semaine-grid" style="flex:1">${barRows}</div>
      <div style="text-align:center;flex-shrink:0">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue-d);margin-bottom:6px">Volume total</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:36px;color:var(--navy);line-height:1">${total.toFixed(1)}h</div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em">/ semaine</div>
      </div>
    </div>
    ${timetableHtml}
  </div>`;
}

        </div>
        <div style="padding:10px 14px;background:#E8F6FD;${i>0?'border-top:1px solid var(--line)':''}font-size:12px;line-height:1.5;color:var(--text)">${h.e || '<span style="color:var(--muted)">—</span>'}</div>
        <div style="padding:10px 14px;background:#FFF8E1;border-left:1px solid var(--line);${i>0?'border-top:1px solid var(--line)':''}font-size:12px;line-height:1.5;color:var(--text)">${h.env || '<span style="color:var(--muted)">—</span>'}</div>

// ── Projection ──
function renderProjection(n) {
  const SAISONS = [2026,2027,2028,2029,2030,2031,2032];
  const JO = [2028,2032];
  const saisons = SAISONS.map(s => ({
    year: s,
    comp: n[`proj_competition_${s}`] || '',
    isJO: JO.includes(s),
  }));

  let last = -1;
  saisons.forEach((s,i) => { if (s.comp) last = i; });
  const toShow = last >= 0 ? saisons.slice(0, last+1) : saisons.slice(0,3);

  return `<div class="card">
    <div class="proj-timeline">
      ${toShow.map(s => `
        <div class="proj-year ${s.isJO ? 'jo' : ''}">
          <div class="proj-year-num">${s.year}${s.isJO ? ' 🔴' : ''}</div>
          <div class="proj-dot"></div>
          <div class="proj-comp">${s.comp || '<span style="color:#ccc">—</span>'}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

// ── Compétitions ──
function renderCompetitions(n) {
  const comps = n.competitions_calendrier || [];
  const list = Array.isArray(comps) ? comps.filter(c => c.type === 'objectif-competition') : [];

  if (list.length === 0) {
    return `<div class="card"><div style="color:var(--muted);font-style:italic;font-size:13px">Aucune compétition objectif renseignée</div></div>`;
  }

  const sorted = [...list].sort((a,b) => new Date(a.startDate) - new Date(b.startDate));

  return `<div class="comp-cards">
    ${sorted.map(c => {
      const prioClass = c.priorite === 'A' ? 'comp-prio-a' : c.priorite === 'B' ? 'comp-prio-b' : 'comp-prio-c';
      const debut = c.startDate ? new Date(c.startDate).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) : '';
      const fin   = c.endDate   ? new Date(c.endDate).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) : '';
      return `<div class="comp-card">
        <div class="comp-card-header" style="background:${c.priorite==='A'?'#FDECEA':c.priorite==='B'?'#FFF3E0':'#EDF7E6'}">
          <span class="comp-prio ${prioClass}">Priorité ${c.priorite||'A'}</span>
          <span class="comp-card-name">${c.nom || 'Compétition'}</span>
        </div>
        ${debut||fin ? `<div class="comp-card-dates">${debut}${fin?' → '+fin:''}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// ── Dimensions ──
function renderDimensions(n) {
  const rankings = n.rankings_by_seasons || {};
  const dims2026 = (rankings[2026] || []).filter(Boolean).slice(0,3);
  const actions = [
    { comment: n.action1_comment, attendus: n.action1_attendus },
    { comment: n.action2_comment, attendus: n.action2_attendus },
    { comment: n.action3_comment, attendus: n.action3_attendus },
  ];
  const colors = ['#0B1F5C','#00AEEF','#C98A3C'];

  if (dims2026.length === 0 && !actions[0].comment) {
    return `<div class="card"><div style="color:var(--muted);font-style:italic;font-size:13px">Aucune dimension ou action renseignée pour 2026</div></div>`;
  }

  return `<div class="dims-grid">
    ${[0,1,2].map(i => {
      const dim = dims2026[i] || '';
      const act = actions[i];
      const col = colors[i];
      return `<div class="dim-card">
        <div class="dim-card-header" style="background:${col}">
          <div class="dim-num">${i+1}</div>
          <div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:2px">Priorité ${i+1}</div>
            <div class="dim-name">${dim || '—'}</div>
          </div>
        </div>
        <div class="dim-card-body">
          <div class="dim-section-label">Action</div>
          <div class="dim-action">${act.comment || '<span style="color:var(--muted);font-style:italic">Non renseignée</span>'}</div>
          <div class="dim-section-label">Résultats attendus</div>
          <div class="dim-attendus">${act.attendus || '<span style="color:var(--muted)">—</span>'}</div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <!-- Classements par saison -->
  ${Object.keys(rankings).length > 0 ? `
  <div class="card" style="margin-top:12px">
    <div class="card-title">Classement des dimensions par saison</div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr>
            <th style="text-align:left;padding:6px 10px;background:var(--navy);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase">Priorité</th>
            ${Object.keys(rankings).map(s=>`<th style="padding:6px 10px;background:var(--navy);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-align:center">${s}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${[0,1,2,3,4].map(i=>`
            <tr style="background:${i%2===0?'var(--line-2)':'#fff'}">
              <td style="padding:6px 10px;font-weight:700;color:var(--navy)">Priorité ${i+1}</td>
              ${Object.values(rankings).map(dims=>`<td style="padding:6px 10px;text-align:center;color:var(--text-2)">${dims[i]||'—'}</td>`).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>` : ''}`;
}

// ── Calendrier synthétique annuel ──
function renderCalendrierSynthetique(n) {
  // Stages : dans n.calendrier, type = 'stage'
  // Compétitions : dans n.competitions_calendrier, type = 'objectif-competition'
  //   priorite = 'resultats'    → R (rouge)
  //   priorite = 'developpement' → D (bleu)
  const stages = (n.calendrier || [])
    .filter(ev => ev.type === 'stage' && ev.startDate)
    .map(ev => ({ ...ev, _cat: 'stage' }));

  const comps = (n.competitions_calendrier || [])
    .filter(ev => ev.startDate)
    .map(ev => ({ ...ev, _cat: ev.priorite === 'developpement' ? 'dev' : 'res' }));

  const relevant = [...stages, ...comps];
  if (relevant.length === 0) return '';

  const typeInfo = {
    'stage': { label:'Stage',                    code:'Stage', color:'#6CB33F', bg:'#EDF7E6' },
    'res':   { label:'Compét. de résultat',      code:'R',     color:'#D7282F', bg:'#FDECEA' },
    'dev':   { label:'Compét. de développement', code:'D',     color:'#00AEEF', bg:'#E8F6FD' },
  };

  const sorted = [...relevant].sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
  const years = [...new Set(sorted.map(ev => new Date(ev.startDate).getFullYear()))].sort();
  const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

  const yearStrips = years.map(year => {
    const monthCells = MONTHS.map((mLabel, mi) => {
      const monthEvents = sorted.filter(ev => {
        const s = new Date(ev.startDate);
        return s.getFullYear() === year && s.getMonth() === mi;
      });
      const hasEvents = monthEvents.length > 0;

      const evHtml = monthEvents.map(ev => {
        const ti = typeInfo[ev._cat] || typeInfo['res'];
        const startD = new Date(ev.startDate);
        const endD = ev.endDate ? new Date(ev.endDate) : startD;
        const days = Math.round((endD - startD) / 86400000) + 1;
        const name = ev.nom || ti.label;
        const shortName = name.length > 13 ? name.slice(0,12) + '…' : name;
        return `<div style="background:${ti.bg};border-left:3px solid ${ti.color};
                            border-radius:0 3px 3px 0;padding:3px 4px;margin-bottom:2px">
          <div style="display:flex;align-items:center;gap:3px">
            <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:8px;
                         color:#fff;background:${ti.color};border-radius:2px;
                         padding:1px 3px;flex-shrink:0;line-height:1.2">${ti.code}</span>
            <span style="font-size:9px;font-weight:600;color:var(--text);line-height:1.2;
                         white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${shortName}</span>
          </div>
          <div style="font-size:8px;color:var(--muted);margin-top:1px">
            ${startD.getDate()}–${endD.getDate()} (${days}j)
          </div>
        </div>`;
      }).join('');

      return `<div style="flex:1;min-width:0;border-right:1px solid var(--line)">
        <div style="padding:3px 4px;background:var(--navy);color:rgba(255,255,255,.75);
                    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8px;
                    text-align:center;letter-spacing:.05em;border-bottom:1px solid rgba(255,255,255,.1)">
          ${mLabel}
        </div>
        <div style="padding:2px;min-height:22px;background:${hasEvents?'#fff':'var(--line-2)'}">
          ${evHtml}
        </div>
      </div>`;
    });

    return `<div style="margin-bottom:10px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;
                  letter-spacing:.12em;text-transform:uppercase;color:var(--navy);
                  margin-bottom:5px">${year}</div>
      <div style="display:flex;border:1px solid var(--line);border-radius:6px;
                  overflow:hidden;overflow-x:auto">
        ${monthCells.join('')}
      </div>
    </div>`;
  });

  return `<div class="card" style="margin-bottom:16px">
    <div class="card-title">Vue synthétique — Stages &amp; Compétitions</div>
    ${yearStrips.join('')}
    <div style="display:flex;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:4px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;
                     color:#fff;background:#6CB33F;border-radius:2px;padding:1px 5px">Stage</span>
        <span style="font-size:11px;color:var(--text-2)">Stage d'entraînement</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;
                     color:#fff;background:#D7282F;border-radius:2px;padding:1px 5px">R</span>
        <span style="font-size:11px;color:var(--text-2)">Compétition de résultat <em style="color:var(--muted)">(objectif résultats)</em></span>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;
                     color:#fff;background:#00AEEF;border-radius:2px;padding:1px 5px">D</span>
        <span style="font-size:11px;color:var(--text-2)">Compétition de développement</span>
      </div>
    </div>
  </div>`;
}

// ── Calendrier FullCalendar ──
function initCalendar(n) {
  const el = document.getElementById('calendar-container');
  if (!el) return;
  if (calendarInstance) { calendarInstance.destroy(); calendarInstance = null; }

  const colorMap = {
    'competition-eaulibre': '#00AEEF',
    'competition-bassin':   '#0B1F5C',
    'objectif-competition': '#D7282F',
    'stage':                '#6CB33F',
    'vacances':             '#C98A3C',
    'scolaire':             '#663F9E',
    'personnel':            '#FF6B9D',
    'coupure':              '#7C88A6',
  };
  const labelMap = {
    'competition-eaulibre': 'Compét. Eau libre',
    'competition-bassin':   'Compét. Bassin',
    'objectif-competition': 'Compét. objectif',
    'stage':  'Stage',
    'vacances':'Vacances / Coupure',
    'scolaire':'Scolaire / Pro',
    'personnel':'Évt. personnel',
    'coupure': 'Coupure',
  };

  const allEvents = [...(n.calendrier || []), ...(n.competitions_calendrier || [])];
  const fcEvents = allEvents.map(ev => ({
    title:           ev.nom || ev.comment || labelMap[ev.type] || ev.type,
    start:           ev.startDate,
    end:             ev.endDate ? (() => { const d = new Date(ev.endDate); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; })() : ev.startDate,
    backgroundColor: ev.color || colorMap[ev.type] || '#7C88A6',
    borderColor:     'transparent',
    extendedProps:   { type: ev.type, comment: ev.comment },
  }));

  calendarInstance = new FullCalendar.Calendar(el, {
    initialView:   'dayGridMonth',
    locale:        'fr',
    firstDay:       1,
    initialDate:   '2026-01-01',
    headerToolbar: { left:'prev,next today', center:'title', right:'dayGridMonth,listMonth' },
    events:         fcEvents,
    height:        'auto',
    eventClick(info) {
      const p = info.event.extendedProps;
      info.el.title = p.comment || info.event.title;
    },
  });

  calendarInstance.render();
}

// ── Charte ──
function renderCharte(n) {
  const signataires = [
    { role:'Athlète',    nom: n.nom_nageur_signe,     date: n.date_nageur,     engagement: n.engagement_nageur },
    { role:'Entraîneur', nom: n.nom_entraineur_signe, date: n.date_entraineur, engagement: n.engagement_entraineur },
    { role:'Fédération', nom: n.nom_federation,        date: n.date_federation, engagement: n.engagement_federation },
  ];

  return `
  <div class="card" style="margin-bottom:12px">
    <div class="card-title">Engagements</div>
    <div class="grid-3">
      ${signataires.map(s => `
        <div>
          <div class="field-label">${s.role}</div>
          <div style="font-size:12px;line-height:1.5;color:var(--text-2);margin-top:4px">${s.engagement || '<span style="color:var(--muted)">—</span>'}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="charte-signataires">
    ${signataires.map(s => `
      <div class="signataire">
        <div class="signataire-role">${s.role}</div>
        <div class="signataire-name">${s.nom || '—'}</div>
        <div class="signataire-date">${s.date ? new Date(s.date).toLocaleDateString('fr-FR') : 'Non signé'}</div>
      </div>`).join('')}
  </div>`;
}
